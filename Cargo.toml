[package]
name = "quarry"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to a commit; bump deliberately (docs/next-steps.md).
emrs = { git = "https://github.com/tohammer/emrs.git", rev = "b824f9fe402a5ce6e43ef2bb588f710b43388467" }
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
nucleo-matcher = { git = "https://github.com/helix-editor/nucleo.git", rev = "8c16d47cdfa9607d3e44df5f81c635c6f43c65ee" }
notify = "8"
notify-debouncer-full = "0.7"
grep-regex = "0.1"
grep-matcher = "0.1"
grep-searcher = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
