[package]
name = "projdex"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to a commit; bump deliberately (docs/next-steps.md).
emrs = { git = "https://github.com/tohammer/emrs.git", rev = "9c47609f5c3273ed0cf1713824da6a5bc6e9d61e" }
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
nucleo-matcher = "0.3"
notify = "8"
notify-debouncer-full = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
